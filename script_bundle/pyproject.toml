[project]
name = "custom-iot-box-runtime"
version = "0.1.0"
description = "Self-hosted IoT Box runtime compatible with Odoo pos_iot longpolling APIs"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "websockets>=16.0",
    "Pillow>=10.0.0",
    "CairoSVG>=2.7.0",
    "qrcode>=8.0",
    "cryptography>=44.0.0",
    "pywin32>=308; platform_system == 'Windows'",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.uvicorn]
factory = false
